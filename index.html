<!DOCTYPE html>
<html lang="id">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Multi Branch POS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-chart-line text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight">Owner Central</span>
                </div>
                <div class="flex items-center gap-4 text-sm font-medium">
                    <div class="bg-indigo-800 px-3 py-1.5 rounded-lg flex items-center gap-2">
                        <i class="fa-regular fa-clock"></i>
                        <span id="currentTime">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Ringkasan Keseluruhan (Semua Cabang)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Total Omset Hari Ini -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-indigo-500">
                    <p class="text-sm font-medium text-gray-500 mb-1">Total Omset Hari Ini</p>
                    <h3 class="text-2xl font-bold text-gray-900" id="grandOmsetHariIni">Rp 0</h3>
                    <p class="text-xs text-green-600 mt-2"><i class="fa-solid fa-arrow-trend-up"></i> Semua Cabang</p>
                </div>
                <!-- Total Omset Bulan Ini -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-blue-500">
                    <p class="text-sm font-medium text-gray-500 mb-1">Total Omset Bulan Ini</p>
                    <h3 class="text-2xl font-bold text-gray-900" id="grandOmsetBulanIni">Rp 0</h3>
                    <p class="text-xs text-blue-600 mt-2"><i class="fa-solid fa-calendar-check"></i> Semua Cabang</p>
                </div>
                <!-- Total Transaksi Hari Ini -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-orange-500">
                    <p class="text-sm font-medium text-gray-500 mb-1">Total Transaksi Hari Ini</p>
                    <h3 class="text-2xl font-bold text-gray-900" id="grandTrxHariIni">0 Trx</h3>
                    <p class="text-xs text-orange-600 mt-2"><i class="fa-solid fa-receipt"></i> Gabungan</p>
                </div>
                <!-- Arus Kas Bulan Ini -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 border-l-4 border-l-emerald-500">
                    <p class="text-sm font-medium text-gray-500 mb-1">Total Arus Kas Masuk (Bulan)</p>
                    <h3 class="text-2xl font-bold text-gray-900" id="grandKasMasukBulanIni">Rp 0</h3>
                    <p class="text-xs text-emerald-600 mt-2"><i class="fa-solid fa-wallet"></i> Gabungan</p>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Rincian Per Cabang</h2>
        <div id="branchesContainer" class="space-y-12">
            <!-- Cabang cards will be injected here via JS -->
        </div>

    </main>

    <script>

        const themes = [
    { headerBg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-900' },
    { headerBg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-900' },
    { headerBg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-800', badge: 'bg-amber-200 text-amber-900' },
    { headerBg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-800', badge: 'bg-rose-200 text-rose-900' }
];

        // --- UTILITAS ---
        const formatRp = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        };

        const updateTime = () => {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleDateString('id-ID', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
        };
        setInterval(updateTime, 1000);
        updateTime();

        // --- DATA MOCKUP (Ganti ini dengan hasil fetch() dari API/Worker Anda) ---
        // Struktur data yang ideal dikembalikan oleh Worker Dashboard Anda
        const dashboardData = {
            cabang: [
                {
                    id: "cabang-1",
                    nama: "Cabang Pusat (Surabaya)",
                    hariIni: {
                        omset: 8500000,
                        transaksi: 145,
                        kasMasuk: 8500000,
                        kasKeluar: 1200000,
                        pembayaran: { cash: 2000000, qris: 4500000, transfer: 2000000 }
                    },
                    bulanIni: {
                        omset: 210000000,
                        kasMasuk: 210000000,
                        kasKeluar: 45000000
                    },
                    grafikHari: {
                        labels: ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"],
                        data: [7.2, 6.8, 8.1, 7.5, 8.5, 10.2, 9.5] // dalam jutaan
                    },
                    grafikBulan: {
                        labels: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags"],
                        data: [150, 165, 180, 175, 190, 205, 200, 210] // dalam jutaan
                    }
                },
                {
                    id: "cabang-2",
                    nama: "Cabang Sidoarjo",
                    hariIni: {
                        omset: 4200000,
                        transaksi: 82,
                        kasMasuk: 4200000,
                        kasKeluar: 500000,
                        pembayaran: { cash: 1500000, qris: 2000000, transfer: 700000 }
                    },
                    bulanIni: {
                        omset: 95000000,
                        kasMasuk: 95000000,
                        kasKeluar: 15000000
                    },
                    grafikHari: {
                        labels: ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"],
                        data: [3.5, 3.8, 4.0, 3.2, 4.2, 5.5, 4.8] // dalam jutaan
                    },
                    grafikBulan: {
                        labels: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags"],
                        data: [70, 75, 82, 80, 85, 92, 88, 95] // dalam jutaan
                    }
                },
                {
                    id: "cabang-3",
                    nama: "Intimedia",
                    hariIni: {
                        omset: 5800000,
                        transaksi: 110,
                        kasMasuk: 5800000,
                        kasKeluar: 800000,
                        pembayaran: { cash: 1800000, qris: 3000000, transfer: 1000000 }
                    },
                    bulanIni: {
                        omset: 125000000,
                        kasMasuk: 125000000,
                        kasKeluar: 22000000
                    },
                    grafikHari: {
                        labels: ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"],
                        data: [4.5, 5.0, 4.8, 5.2, 5.8, 7.0, 6.5] // dalam jutaan
                    },
                    grafikBulan: {
                        labels: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags"],
                        data: [95, 100, 110, 105, 115, 120, 118, 125] // dalam jutaan
                    }
                }
            ]
        };

        // --- RENDER LOGIC ---
        function renderGrandSummary(data) {
            let totalOmsetHariIni = 0;
            let totalOmsetBulanIni = 0;
            let totalTrxHariIni = 0;
            let totalKasMasukBulan = 0;

            data.cabang.forEach(c => {
                totalOmsetHariIni += c.hariIni.omset;
                totalOmsetBulanIni += c.bulanIni.omset;
                totalTrxHariIni += c.hariIni.transaksi;
                totalKasMasukBulan += c.bulanIni.kasMasuk;
            });

            document.getElementById('grandOmsetHariIni').innerText = formatRp(totalOmsetHariIni);
            document.getElementById('grandOmsetBulanIni').innerText = formatRp(totalOmsetBulanIni);
            document.getElementById('grandTrxHariIni').innerText = `${totalTrxHariIni} Trx`;
            document.getElementById('grandKasMasukBulanIni').innerText = formatRp(totalKasMasukBulan);
        }

        function renderBranches(data) {
            const container = document.getElementById('branchesContainer');
            container.innerHTML = '';
            

            data.cabang.forEach((cabang, index) => {
                const theme = themes[index % themes.length];
                const totalPembayaranHari = cabang.hariIni.pembayaran.cash + cabang.hariIni.pembayaran.qris + cabang.hariIni.pembayaran.transfer;
                const pctCash = totalPembayaranHari > 0 ? ((cabang.hariIni.pembayaran.cash / totalPembayaranHari) * 100).toFixed(1) : 0;
                const pctQris = totalPembayaranHari > 0 ? ((cabang.hariIni.pembayaran.qris / totalPembayaranHari) * 100).toFixed(1) : 0;
                const pctTransfer = totalPembayaranHari > 0 ? ((cabang.hariIni.pembayaran.transfer / totalPembayaranHari) * 100).toFixed(1) : 0;

                // Hitung Kas Bersih Bulan Ini (Kas Masuk - Kas Keluar)
                const kasMasukBulan = cabang.bulanIni.kasMasuk || 0;
                const kasKeluarBulan = cabang.bulanIni.kasKeluar || 0;
                const kasBersihBulan = kasMasukBulan - kasKeluarBulan;
                const totalPiutangBulan = cabang.bulanIni.piutang || 0;
// Render List 10 Produk Terlaris
                let listProdukHTML = '';
                if (cabang.topProduk && cabang.topProduk.length > 0) {
                    cabang.topProduk.forEach((prod, i) => {
                        listProdukHTML += `
                        <li class="flex justify-between items-center bg-white p-2 rounded-lg border border-gray-100 shadow-sm mb-2">
                            <span class="text-gray-700 font-medium text-sm truncate flex-1">
                                <span class="text-gray-400 w-5 inline-block">${i + 1}.</span> ${prod.nama_produk}
                            </span>
                            <span class="font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-md text-xs whitespace-nowrap">
                                ${prod.total_qty} qty
                            </span>
                        </li>`;
                    });
                } else {
                    listProdukHTML = '<li class="text-gray-400 text-center text-xs italic py-4">Belum ada data penjualan bulan ini.</li>';
                }

                const html = `
                    <div class="${theme.headerBg} rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <!-- Card Header (SAMA SEPERTI SEBELUMNYA) -->
                        <div class="bg-gray-50 border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                            <h3 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-store text-indigo-600 mr-2"></i> ${cabang.nama}</h3>
                            <span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">Online</span>
                        </div>
                        
                        <div class="p-6">
                            <!-- Metrics Grid (SAMA SEPERTI SEBELUMNYA) -->
                            ... (biarkan bagian kotak HARI INI dan BULAN INI seperti semula) ...

                            <!-- BAGIAN BAWAH: Top 10 Produk & Grafik Bulanan -->
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 bg-gray-50 p-5 rounded-xl border border-gray-100 mt-8">
                                
                                <!-- Top 10 Produk -->
                                <div class="flex flex-col">
                                    <p class="text-sm font-semibold text-gray-700 mb-4 border-b border-gray-200 pb-2">10 Produk Terlaris (Bulan Ini)</p>
                                    <ul class="overflow-y-auto pr-1 flex-1 max-h-56 hide-scrollbar">
                                        ${listProdukHTML}
                                    </ul>
                                </div>

                                <!-- Grafik Bulanan -->
                                <div>
                                    <p class="text-sm font-semibold text-gray-700 mb-4 text-center border-b border-gray-200 pb-2">Grafik Omset Bulanan 2026 (Jutaan Rp)</p>
                                    <div class="h-56 w-full relative">
                                        <canvas id="chartBulan-${index}"></canvas>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            // Initialize Charts after DOM injection
            initCharts(data);
        }

        function initCharts(data) {
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#6b7280';
            Chart.defaults.scale.grid.color = '#f3f4f6';

            data.cabang.forEach((cabang, index) => {
                // HANYA PROSES DATA GRAFIK BULANAN TAHUN INI
                const labelsBulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
                const dataBulan = new Array(12).fill(0);
                
                if(cabang.grafikBulanRaw) {
                    cabang.grafikBulanRaw.forEach(row => {
                        const monthIndex = parseInt(row.bulan, 10) - 1; 
                        if(monthIndex >= 0 && monthIndex < 12) {
                            dataBulan[monthIndex] = row.omset / 1000000; 
                        }
                    });
                }

                // Render Chart Bulanan (Bar Chart)
                const ctxBulan = document.getElementById(`chartBulan-${index}`).getContext('2d');
                new Chart(ctxBulan, {
                    type: 'bar',
                    data: {
                        labels: labelsBulan,
                        datasets: [{
                            label: 'Omset Bulanan',
                            data: dataBulan,
                            backgroundColor: '#3b82f6', 
                            borderRadius: 4,
                            barPercentage: 0.6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, border: {display: false} },
                            x: { grid: {display: false}, border: {display: false} }
                        }
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('grandOmsetHariIni').innerText = "Loading...";
            document.getElementById('branchesContainer').innerHTML = '<p class="text-center text-gray-500 py-10">Mengambil data dari semua cabang...</p>';

            const workerBaseUrl = 'https://ownerdash.fafaritrit.workers.dev/'; 
            
            // Web meminta data ke worker 3 kali berturut-turut untuk masing-masing cabang
            Promise.all([
                fetch(workerBaseUrl + '?cabang=intimedia').then(res => res.json()),
                fetch(workerBaseUrl + '?cabang=suci').then(res => res.json()),
                fetch(workerBaseUrl + '?cabang=lamongan').then(res => res.json())
            ])
            .then(results => {
                // Menyatukan ketiga hasil respons
                const combinedData = { cabang: [] };
                
                results.forEach(res => {
                    if (res.cabang && res.cabang.length > 0) {
                        combinedData.cabang.push(res.cabang[0]);
                    }
                });
                
                // Merender UI seperti biasa
                renderGrandSummary(combinedData); 
                renderBranches(combinedData); 
            })
            .catch(err => {
                console.error("Error fetching data:", err);
                document.getElementById('branchesContainer').innerHTML = `<p class="text-center text-red-500 py-10">Terjadi kesalahan saat mengambil data. Pastikan URL Worker sudah benar.</p>`;
                document.getElementById('grandOmsetHariIni').innerText = "Error";
                document.getElementById('grandOmsetBulanIni').innerText = "Error";
            });
        });

    </script>
</body>
</html>
